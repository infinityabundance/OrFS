[package]
name = "orfs"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "OrFS — a non-withdrawal, concealed-expansion FUSE filesystem with io_uring backing and EKBLOOM-accelerated historical reads"
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/OrFS"
homepage = "https://github.com/infinityabundance/OrFS"
documentation = "https://docs.rs/orfs"
readme = "README.md"
keywords = ["filesystem", "fuse", "io-uring", "append-only", "snapshot"]
categories = ["filesystem", "os::unix-apis"]
# Evidence, docs and scripts are large and are not needed to build the crate.
# `crates.io` rejects *any* dependency that is not itself published there, so a
# `cargo publish` also requires the rev-pinned `ekbloom` git dependency to be
# published first — see `docs/PUBLISHING.md`.
exclude = ["/evidence", "/docs", "/scripts", "/research", "/mnt-scratch"]

[lib]
name = "orfs"
path = "src/lib.rs"
# The library carries no doc-tests (`cargo test --doc` reports "running 0 tests"),
# and the doctest target is the one that trips the cargo/rustdoc `--extern`
# staleness race described under the `endurance` feature below (rustdoc is handed
# a dependency rlib path that a concurrent test-target build has already
# replaced). Disabling it keeps the default `cargo test` gate deterministic and
# loses no coverage.
doctest = false

[[bin]]
name = "orfs"
path = "src/main.rs"

[features]
# Fault-injection failpoints (research §37). Off by default: production builds
# contain a compile-time no-op at every injection site.
#
# The `powerloss` feature (Phase 17) compiles in the simulated storage-device
# model (`src/powerloss.rs`). It is inert unless a device is explicitly attached
# (`powerloss::attach`), which only tests do; a plain `--no-default-features`
# build carries a no-op stub at every seam instead. It is on by default so the
# power-loss court runs in the ordinary `cargo test` gate.
default = ["powerloss"]
failpoints = []
powerloss = []
# Phase 27 endurance/publish-cost/recovery harness (`benches/endurance.rs`). Opt-in
# so the ordinary `cargo test` correctness gate never builds it (building a second
# `harness = false` bench alongside the doctest pass trips a cargo/rustdoc
# `--extern` staleness race). `scripts/container-endurance.sh` enables it.
endurance = []

[dependencies]
# --- Kernel / transport interfaces (version-pinned per directive) ---
fuser = { version = "=0.18.0", default-features = false }
io-uring = "=0.7.15"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = [
    "fs", "mount", "user", "sched", "signal", "poll", "time", "ioctl",
    "process", "uio", "feature",
] }

# --- Acceleration engine (independent, version-pinned native-Rust dependency) ---
# EKBLOOM is developed concurrently and independently; OrFS consumes it as an
# exact-version crates.io dependency, never by copying its source. The `=0.3.0`
# requirement pins the published release whose contents were verified equal to
# the previously pinned git revision
# `708c349128668bf26b50684ce473d8de4058dc31` (see docs/LIMITATIONS.md §1 and
# evidence/receipts/ekbloom.json). Publishing OrFS to crates.io requires this
# registry form, because crates.io rejects git dependencies (Phase 35).
ekbloom = "=0.3.0"

# --- CLI / diagnostics ---
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Serialization (query API, evidence, JSON output) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Integrity / hashing (record checksums, generation integrity) ---
crc32c = "0.6"
blake3 = "1"

# --- Concurrency primitives ---
parking_lot = "0.12"
rustc-hash = "2"

# Bounded Loom concurrency models (Phase 70). `src/sync_model.rs` uses
# `loom::sync` and `tests/loom_concurrency.rs` calls `loom::model`, but only
# when the build sets `--cfg loom` (`scripts/container-loom.sh`). The target-cfg
# gate keeps loom out of every normal build, so `cargo build` / `cargo test` are
# unaffected and the default test count does not change.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[dev-dependencies]
proptest = "1"
tempfile = "3"
rand = "0.8"
serde_json = "1"
libc = "0.2"
# Used by tests/hostile_files.rs to forge a *correctly framed* hostile record
# (so the test exercises semantic validation, not just checksum rejection).
crc32c = "0.6"

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "backing_io"
harness = false

[[bench]]
name = "mechanisms"
harness = false

[[bench]]
name = "endurance"
harness = false
required-features = ["endurance"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
# `loom` is a custom cfg name (Phase 70): it selects the `[target.'cfg(loom)'…]`
# loom dependency and the `loom::sync` imports in `src/sync_model.rs`, and it is
# set only by `scripts/container-loom.sh` (`RUSTFLAGS="--cfg loom"`). Register
# it so the `unexpected_cfgs` lint accepts the cfg-gated model without a
# blanket allow.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
