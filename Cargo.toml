[package]
name = "orfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "OrFS — non-withdrawal, concealed-expansion FUSE filesystem with io_uring backing and EKBLOOM acceleration"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "orfs"
path = "src/lib.rs"

[[bin]]
name = "orfs"
path = "src/main.rs"

[features]
# Fault-injection failpoints (research §37). Off by default: production builds
# contain a compile-time no-op at every injection site.
#
# The `powerloss` feature (Phase 17) compiles in the simulated storage-device
# model (`src/powerloss.rs`). It is inert unless a device is explicitly attached
# (`powerloss::attach`), which only tests do; a plain `--no-default-features`
# build carries a no-op stub at every seam instead. It is on by default so the
# power-loss court runs in the ordinary `cargo test` gate.
default = ["powerloss"]
failpoints = []
powerloss = []

[dependencies]
# --- Kernel / transport interfaces (version-pinned per directive) ---
fuser = { version = "=0.18.0", default-features = false }
io-uring = "=0.7.15"
libc = "0.2"
nix = { version = "0.31", default-features = false, features = [
    "fs", "mount", "user", "sched", "signal", "poll", "time", "ioctl",
    "process", "uio", "feature",
] }

# --- Acceleration engine (independent, version-pinned native-Rust dependency) ---
# Consumed as a rev-pinned git dependency on the separately-versioned EKBLOOM
# crate, fetched from the public GitHub repository below. EKBLOOM is developed
# concurrently and independently; pinning to an immutable git revision that
# exists on `origin/main` makes OrFS builds reproducible from a clean checkout
# (no sibling working tree required) and immune to uncommitted edits. Source is
# never copied into OrFS; the mathematical state machinery lives in EKBLOOM.
#
# Re-pinned in Phase 13: the previous pin (a local `file://` URL at rev
# 255452e1) no longer resolved because EKBLOOM's history was force-pushed; the
# rev is now an existing commit on the public `origin/main`. See
# evidence/receipts/ekbloom.json and docs/LIMITATIONS.md §1.
ekbloom = { git = "https://github.com/infinityabundance/EKBLOOM", rev = "708c349128668bf26b50684ce473d8de4058dc31", version = "=0.3.0" }

# --- CLI / diagnostics ---
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# --- Serialization (query API, evidence, JSON output) ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Integrity / hashing (record checksums, generation integrity) ---
crc32c = "0.6"
blake3 = "1"

# --- Concurrency primitives ---
parking_lot = "0.12"
rustc-hash = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
rand = "0.8"
serde_json = "1"
libc = "0.2"
# Used by tests/hostile_files.rs to forge a *correctly framed* hostile record
# (so the test exercises semantic validation, not just checksum rejection).
crc32c = "0.6"

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "backing_io"
harness = false

[[bench]]
name = "mechanisms"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
